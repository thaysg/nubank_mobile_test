name: nubank_mobile_test
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2-dev.2
  riverpod_annotation: ^4.0.3-dev.2
  go_router: ^17.2.3
  dio: ^5.4.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  flutter_screenutil: ^5.9.0
  equatable: ^2.0.5
  url_launcher: ^6.2.5
  shared_preferences: ^2.5.5
  device_preview_plus: ^2.3.2
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^4.0.4-dev.3
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.8.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#959be1"
  image: assets/images/app_logo.png
  color_dark: "#959be1"
  android_12:
  fullscreen: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
